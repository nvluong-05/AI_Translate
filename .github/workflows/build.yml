name: Build AI_Translate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Setup Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip "setuptools<70" wheel
        pip install -r requirements.txt pyinstaller

    - name: Inject API key into all modules
      run: |
        # Inject vào translation.py (hardcode key cũ)
        (Get-Content translation.py) -replace 'PLACEHOLDER_KEY', '${{ secrets.OPENROUTER_API_KEY }}' | Set-Content translation.py

        # Tạo file .env để voice_module.py và youtube_translate.py đọc qua load_dotenv()
        "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" | Out-File -FilePath .env -Encoding utf8
      shell: pwsh

    - name: Build .exe
      run: |
        pyinstaller --noconfirm --onefile --noconsole `
          --name "AI_Translate" `
          --icon="assets/book-open-cover.ico" `
          --add-data ".env;." `
          --add-data "assets;assets" `
          --hidden-import "PyQt6.sip" `
          --hidden-import "sounddevice" `
          --hidden-import "whisper" `
          --hidden-import "youtube_translate" `
          --hidden-import "youtube_ui" `
          --hidden-import "voice_module" `
          --hidden-import "history" `
          --hidden-import "utils" `
          --hidden-import "ui" `
          --hidden-import "translation" `
          main.py
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: AI_Translate
        path: dist/AI_Translate.exe