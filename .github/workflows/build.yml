name: Build AI_Translate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt pyinstaller

    - name: Inject API key
      run: |
        (Get-Content translation.py) -replace 'PLACEHOLDER_KEY', '${{ secrets.GEMINI_API_KEY }}' | Set-Content translation.py
      shell: pwsh

    - name: Build .exe
      run: pyinstaller --onefile --noconsole --name "AI_Translate" main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI_Translate
        path: dist/AI_Translate.exe